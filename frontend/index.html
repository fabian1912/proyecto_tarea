<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tareas App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <header style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ccc; padding-bottom: 10px; margin-bottom: 20px;">
            <div>
                <h1>Panel de tareas (vanilla 35)</h1>
                <p>conectado como: <strong id="currentUser" style="color: #2563eb;"></strong></p>
            </div>
            <button id="logoutBtn" style="width:auto;background-color:#ef4444;padding: 8px 15px;font size:0.85rem; color: white; border: none; border-radius:4px; cursor: pointer; ">
                cerrar sesión
            </button>
        </header>

        <form id="taskForm">
            <input type="text" id="taskTitle" placeholder="¿que necesitas hacer?" required>
            <textarea id="taskDescription" placeholder="Descripción (opcional)..." rows="2"></textarea>
            <button type="submit">Agregar tarea</button>
        </form>

        <main>
            <h2> Tus tareas</h2>
            <div id="" tasksContainer></div>
        </main>
    </div>

    <div id="customModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modalTitle">Mensaje del sistema</h3>
            <p id="modalMessage">Aqui va el texto aplicativo</p>
            <div class="modal-buttons">
                <button id="modalCancelBtn" class="btn-secondary">Cancelar</button>
                <button id="modalConfirmBtn" class="btn-primary">Confirmar</button>
            </div>
        </div>
    </div>

    <div id="loginModal" class="modal-overlay">
        <div class="modal-box">
            <h3>Identificador de autor</h3>
            <p>por favor, ingresar tu nombre para comenzar a gestionar tus tareas:</p>
            <form id="loginform" style="box-shadow: none;padding: 0; margin: 0; display: flex; flex-direction: column; gap:10px;">
                <input type="text" id="loginInput" placeholder="Ej. Dhaniel, Ana..." required>
                <div class="modal-buttons">
                    <button type="submit" class="btn-primary">Ingresar al panel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
